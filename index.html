<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Café Aroma: café de especialidad peruano en Trujillo.">
    <title>Café Aroma - Trujillo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/secciones.css">
</head>
<body>
   <header class="header" id="header">
        <div class="contenedor nav">
            <a href="#inicio" class="logo">☕ Café <span>Aroma</span></a>
            <nav>
                <ul class="nav-links" id="navLinks">
                    <li><a href="#inicio" class="activo">Inicio</a></li>
                    <li><a href="#nosotros">Nosotros</a></li>
                    <li><a href="#menu">Menú</a></li>
                    <li><a href="#testimonios">Opiniones</a></li>
                    <li><a href="#contacto">Contacto</a></li>
                </ul>
            </nav>
            <div class="nav-acciones">
                <button class="btn-carrito" id="btnCarrito" aria-label="Ver pedido">
                    🛒 <span class="contador" id="contadorCarrito">0</span>
                </button>
                <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
            </div>
        </div>
    </header>

    <aside class="carrito" id="carrito" aria-label="Tu pedido">
        <div class="carrito-cabecera">
            <h3>Tu pedido</h3>
            <button class="cerrar" id="cerrarCarrito" aria-label="Cerrar">✕</button>
        </div>
        <ul class="carrito-lista" id="carritoLista"></ul>
        <div class="carrito-pie">
            <p>Total: <strong id="carritoTotal">S/ 0.00</strong></p>
            <button class="btn" id="btnConfirmar">Confirmar pedido</button>
            <button class="btn-texto" id="btnVaciar">Vaciar</button>
        </div>
    </aside>



<!-- Fin body-->
</body>
</html>
